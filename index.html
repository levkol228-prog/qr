<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth QR Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --accent-color: #818cf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 450px;
            text-align: center;
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
        }

        /* Контейнер для QR с плавным переходом */
        .qr-wrapper {
            background: #f1f5f9;
            padding: 2rem;
            border-radius: 2rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2.5rem;
            min-width: 220px;
            min-height: 220px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .qr-wrapper:hover {
            background: #eef2ff;
            border-color: var(--primary-color);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.1);
        }

        /* Стили самого QR кода */
        #qrcode img, #qrcode canvas {
            border-radius: 1rem;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-width: 100%;
        }

        /* Плавное увеличение самого кода при наведении на обертку */
        .qr-wrapper:hover #qrcode img, 
        .qr-wrapper:hover #qrcode canvas {
            transform: scale(1.1);
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 1.2rem 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 1.2rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            background: #f8fafc;
        }

        input:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .footer {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            70% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }

        .placeholder-text {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>QR Magic</h1>
    <p class="subtitle">Генерация в реальном времени</p>
    
    <div class="qr-wrapper" id="wrapper">
        <div id="qrcode">
            <span class="placeholder-text">Введите текст</span>
        </div>
    </div>

    <div class="input-group">
        <input type="text" id="text" placeholder="Начните печатать что-нибудь..." autocomplete="off">
    </div>

    <div class="footer">
        <span class="status-dot"></span>
        Автоматическое обновление
    </div>
</div>

<script>
    const textInput = document.getElementById('text');
    const qrContainer = document.getElementById('qrcode');
    let qrInstance = null;

    function updateQR() {
        const value = textInput.value.trim();
        
        // Очищаем содержимое контейнера
        qrContainer.innerHTML = '';

        if (value === '') {
            qrContainer.innerHTML = '<span class="placeholder-text">Введите текст</span>';
            return;
        }

        // Задержка перед генерацией для плавности ввода (Debounce)
        clearTimeout(window.qrTimeout);
        window.qrTimeout = setTimeout(() => {
            // Плавная подготовка к появлению
            qrContainer.style.opacity = '0';
            qrContainer.style.transform = 'scale(0.95)';
            
            requestAnimationFrame(() => {
                qrInstance = new QRCode(qrContainer, {
                    text: value,
                    width: 200,
                    height: 200,
                    colorDark: "#1e293b",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                // Анимация появления после генерации
                setTimeout(() => {
                    qrContainer.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
                    qrContainer.style.opacity = '1';
                    qrContainer.style.transform = 'scale(1)';
                }, 20);
            });
        }, 200);
    }

    // Слушаем ввод текста
    textInput.addEventListener('input', updateQR);

    // Инициализация
    window.onload = updateQR;
</script>

</body>
</html>
